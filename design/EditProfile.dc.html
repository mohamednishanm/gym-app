<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:#1A1A1A;background:#F7F7F5}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;padding:56px 22px 28px;display:flex;flex-direction:column;gap:16px;background:#F7F7F5">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:14px;font-weight:600;color:#55554F;background:#EFEFEB;padding:8px 14px;border-radius:999px">Cancel</span>
<span style="font-size:15px;font-weight:600">Edit profile</span>
<span style="width:64px"></span>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:22px;font-weight:600;letter-spacing:-0.02em">Your details</span>
<span style="font-size:13px;color:#6B6B66">Changing height, age, sex or goal updates your calorie target from the next day.</span>
</div>
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:500;color:#6B6B66">Name</span>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E6E2;display:flex;align-items:center;padding:0 14px;font-size:15px">Mohamed</div>
</div>
<div style="display:flex;gap:10px">
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:500;color:#6B6B66">Age</span>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E6E2;display:flex;align-items:center;padding:0 14px;font-size:15px">28</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:500;color:#6B6B66">Sex</span>
<div style="height:48px;border-radius:12px;background:#EFEFEB;padding:4px;display:flex;gap:4px;box-sizing:border-box">
<span style="flex:1;border-radius:9px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500">Male</span>
<span style="flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6B6B66">Female</span>
</div>
</div>
</div>
<div style="display:flex;gap:10px">
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:500;color:#6B6B66">Height (cm)</span>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E6E2;display:flex;align-items:center;padding:0 14px;font-size:15px">177.8</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:500;color:#6B6B66">Goal weight (kg)</span>
<div style="height:48px;border-radius:12px;background:#FFFFFF;border:1px solid #E6E6E2;display:flex;align-items:center;padding:0 14px;font-size:15px">74.0</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:500;color:#6B6B66">Activity level</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid #E6E6E2;background:#FFFFFF;color:#6B6B66">Sedentary</span>
<span style="font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid #E6E6E2;background:#FFFFFF;color:#6B6B66">Light</span>
<span style="font-size:13px;padding:8px 14px;border-radius:999px;background:#2BAE84;color:#FFFFFF;font-weight:600">Moderate</span>
<span style="font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid #E6E6E2;background:#FFFFFF;color:#6B6B66">Very active</span>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:500;color:#6B6B66">Goal</span>
<div style="display:flex;gap:8px">
<span style="flex:1;text-align:center;font-size:13px;padding:10px 0;border-radius:12px;background:#2BAE84;color:#FFFFFF;font-weight:600">Lose</span>
<span style="flex:1;text-align:center;font-size:13px;padding:10px 0;border-radius:12px;border:1px solid #E6E6E2;background:#FFFFFF;color:#6B6B66">Maintain</span>
<span style="flex:1;text-align:center;font-size:13px;padding:10px 0;border-radius:12px;border:1px solid #E6E6E2;background:#FFFFFF;color:#6B6B66">Gain</span>
</div>
</div>
</div>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
<button style="height:52px;border:0;border-radius:14px;background:#2BAE84;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer">Save changes</button>
<span style="font-size:12px;color:#8A8A85;text-align:center">Your details stay on this device.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
